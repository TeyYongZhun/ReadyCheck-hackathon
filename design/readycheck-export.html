<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>ReadyCheck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: one spatial canvas — ground, floating glass widgets, a centred omni bar; flows to a single column below 1220px. Dark-first (Spatial Night), Daylight for light viewers. */
:root {
  --ground: #0b1214;
  --ground-raised: #121c1f;
  --haze: #1f2d31;
  --glass-100: rgba(255,255,255,0.04);
  --glass-200: rgba(255,255,255,0.07);
  --glass-300: rgba(255,255,255,0.11);
  --glass-edge: rgba(255,255,255,0.12);
  --hairline: rgba(255,255,255,0.08);
  --ink: #ecf3f0;
  --ink-muted: #a3b3ad;
  --ink-faint: #899b94;
  --ready: #5fe3b5;
  --ready-ink: #04211a;
  --ready-soft: rgba(95,227,181,0.12);
  --escalate: #ffad5c;
  --escalate-ink: #2a1400;
  --escalate-soft: rgba(255,173,92,0.12);
  --screen: #081012;
  --screen-ink: #e9f1ee;
  --orb-a: rgba(95,227,181,0.20);
  --orb-b: rgba(255,173,92,0.14);
  --focus: var(--ready);
  --shadow-card: inset 0 1px 0 rgba(255,255,255,0.06), 0 10px 30px rgba(0,0,0,0.35);
  --shadow-lift: inset 0 1px 0 rgba(255,255,255,0.08), 0 24px 56px rgba(0,0,0,0.50);
  --shadow-float: inset 0 1px 0 rgba(255,255,255,0.10), 0 0 0 1px rgba(255,255,255,0.04), 0 30px 80px rgba(0,0,0,0.55);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-7: 48px;
  --space-8: 64px;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --radius-pill: 999px;
  --blur-glass: 24px;
  --blur-heavy: 40px;
  --z-widget: 10;
  --z-omni: 20;
  --z-dock: 30;
  --z-flight: 40;
  --font-sans: Geist, "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-display: "Instrument Serif", Georgia, serif;
  --font-mono: "Geist Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --ground: #e4ebe8;
  --ground-raised: #eff4f2;
  --haze: #c6d3ce;
  --glass-100: rgba(255,255,255,0.45);
  --glass-200: rgba(255,255,255,0.62);
  --glass-300: rgba(255,255,255,0.82);
  --glass-edge: rgba(255,255,255,0.85);
  --hairline: rgba(16,32,28,0.10);
  --ink: #0f1e1a;
  --ink-muted: #44564f;
  --ink-faint: #56675f;
  --ready: #086c50;
  --ready-ink: #ffffff;
  --ready-soft: rgba(10,122,90,0.10);
  --escalate: #a14f0a;
  --escalate-ink: #ffffff;
  --escalate-soft: rgba(161,79,10,0.09);
  --screen: #12201c;
  --screen-ink: #e9f1ee;
  --orb-a: rgba(10,122,90,0.16);
  --orb-b: rgba(255,160,70,0.22);
  --focus: var(--ready);
  --shadow-card: inset 0 1px 0 rgba(255,255,255,0.9), 0 0 0 1px rgba(16,32,28,0.05), 0 10px 30px rgba(20,48,40,0.10);
  --shadow-lift: inset 0 1px 0 rgba(255,255,255,0.95), 0 0 0 1px rgba(16,32,28,0.06), 0 24px 56px rgba(20,48,40,0.18);
  --shadow-float: inset 0 1px 0 rgba(255,255,255,1), 0 0 0 1px rgba(16,32,28,0.06), 0 30px 80px rgba(20,48,40,0.20);
  color-scheme: light;
} }
:root[data-theme="light"] {
  --ground: #e4ebe8;
  --ground-raised: #eff4f2;
  --haze: #c6d3ce;
  --glass-100: rgba(255,255,255,0.45);
  --glass-200: rgba(255,255,255,0.62);
  --glass-300: rgba(255,255,255,0.82);
  --glass-edge: rgba(255,255,255,0.85);
  --hairline: rgba(16,32,28,0.10);
  --ink: #0f1e1a;
  --ink-muted: #44564f;
  --ink-faint: #56675f;
  --ready: #086c50;
  --ready-ink: #ffffff;
  --ready-soft: rgba(10,122,90,0.10);
  --escalate: #a14f0a;
  --escalate-ink: #ffffff;
  --escalate-soft: rgba(161,79,10,0.09);
  --screen: #12201c;
  --screen-ink: #e9f1ee;
  --orb-a: rgba(10,122,90,0.16);
  --orb-b: rgba(255,160,70,0.22);
  --focus: var(--ready);
  --shadow-card: inset 0 1px 0 rgba(255,255,255,0.9), 0 0 0 1px rgba(16,32,28,0.05), 0 10px 30px rgba(20,48,40,0.10);
  --shadow-lift: inset 0 1px 0 rgba(255,255,255,0.95), 0 0 0 1px rgba(16,32,28,0.06), 0 24px 56px rgba(20,48,40,0.18);
  --shadow-float: inset 0 1px 0 rgba(255,255,255,1), 0 0 0 1px rgba(16,32,28,0.06), 0 30px 80px rgba(20,48,40,0.20);
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--ground); color: var(--ink); font-family: var(--font-sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0; overflow-x: hidden;
}
#app { min-height: 100%; }
/* ReadyCheck — components. Every colour, radius, shadow and blur is a token from tokens.json. */
:root {
  --rc-ease: cubic-bezier(.2, .8, .2, 1);
  --rc-ease-out: cubic-bezier(.16, 1, .3, 1);
  --rc-dur-1: 160ms;
  --rc-dur-2: 280ms;
  --rc-dur-3: 560ms;
}
.rc-canvas, .rc-canvas *, .rc-stage, .rc-stage *, .rc-flight, .rc-flight *, .rc-cc, .rc-cc *, .rc-cc2, .rc-cc2 * { box-sizing: border-box; }
.rc-icon { flex: none; display: block; }
.rc-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:where(.rc-canvas, .rc-stage, .rc-cc, .rc-cc2) button { font: inherit; color: inherit; }
.rc-canvas :focus-visible, .rc-stage :focus-visible, .rc-cc :focus-visible, .rc-cc2 :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- Glass ---------- */
.rc-glass {
  background: var(--glass-200);
  -webkit-backdrop-filter: blur(var(--blur-glass)) saturate(1.5);
  backdrop-filter: blur(var(--blur-glass)) saturate(1.5);
  border: 1px solid var(--glass-edge);
  box-shadow: var(--shadow-card);
}
.rc-glass-1 { background: var(--glass-100); box-shadow: none; }
.rc-glass-3 {
  background: var(--glass-300);
  -webkit-backdrop-filter: blur(var(--blur-heavy)) saturate(1.6);
  backdrop-filter: blur(var(--blur-heavy)) saturate(1.6);
  box-shadow: var(--shadow-float);
}

/* A neutral stage for previews: the canvas ground, dot grid and ambient light. */
.rc-stage {
  position: relative; overflow: hidden; isolation: isolate;
  padding: var(--space-6); min-height: 100vh;
  background: var(--ground); color: var(--ink); font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
.rc-stage::before, .rc-canvas::before, .rc-cc::before, .rc-cc2::before {
  content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background-image: radial-gradient(var(--haze) 1.1px, transparent 1.4px);
  background-size: 24px 24px;
}
.rc-stage::after {
  content: ''; position: absolute; z-index: -1; pointer-events: none;
  width: 520px; height: 520px; left: -160px; top: -220px; border-radius: 50%;
  background: var(--orb-a); filter: blur(90px);
}
.rc-stage-row { display: flex; flex-wrap: wrap; gap: var(--space-5); align-items: flex-start; }

/* ---------- Omni bar ---------- */
.rc-omni { width: 100%; }
.rc-omni-bar {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: var(--space-3);
  height: var(--space-8); padding: 0 10px 0 22px;
  border-radius: var(--radius-pill);
  transition: height var(--rc-dur-3) var(--rc-ease-out), border-color var(--rc-dur-2), box-shadow var(--rc-dur-2);
}
.rc-omni.is-compact .rc-omni-bar { height: 56px; }
.rc-omni-bar:focus-within { border-color: var(--ready); box-shadow: var(--shadow-float), 0 0 0 4px var(--ready-soft); }
.rc-omni-lead { color: var(--ink-muted); display: flex; }
.rc-omni-input {
  flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 0;
  font: 400 17px/24px var(--font-sans); color: var(--ink); letter-spacing: -0.005em;
}
.rc-omni-input::placeholder { color: var(--ink-faint); }
.rc-canvas .rc-omni-input:focus-visible, .rc-stage .rc-omni-input:focus-visible { outline: none; }
.rc-kbd {
  font: 400 12px/16px var(--font-mono); color: var(--ink-muted);
  padding: 3px 7px; border-radius: 8px; border: 1px solid var(--hairline); background: var(--glass-100);
}
.rc-omni-status { font: 400 12px/16px var(--font-mono); color: var(--ready); white-space: nowrap; }
.rc-omni-go {
  width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; cursor: pointer;
  display: grid; place-items: center; background: var(--ready); color: var(--ready-ink);
  transition: transform var(--rc-dur-1) var(--rc-ease), background var(--rc-dur-2), color var(--rc-dur-2);
}
.rc-omni-go:hover:not(:disabled) { transform: scale(1.06); }
.rc-omni-go:disabled { background: var(--glass-100); color: var(--ink-faint); cursor: default; box-shadow: inset 0 0 0 1px var(--hairline); }
.rc-omni.is-compact .rc-omni-go { width: 40px; height: 40px; }
.rc-omni-scan {
  position: absolute; left: 0; bottom: 0; height: 2px; width: 28%;
  background: var(--ready); border-radius: 2px; opacity: 0; transform: translateX(-100%);
}
.rc-omni.is-busy .rc-omni-scan { opacity: 1; animation: rc-scan 1.1s var(--rc-ease) infinite; }
@keyframes rc-scan { to { transform: translateX(360%); } }
.rc-omni-suggest { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-2); margin-top: var(--space-4); }
.rc-chip {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px 0 12px; cursor: pointer;
  border-radius: var(--radius-pill); border: 1px solid var(--glass-edge); background: var(--glass-100);
  -webkit-backdrop-filter: blur(var(--blur-glass)); backdrop-filter: blur(var(--blur-glass));
  font: 500 13px/1 var(--font-sans); color: var(--ink-muted) !important;
  transition: transform var(--rc-dur-1) var(--rc-ease), background var(--rc-dur-2), color var(--rc-dur-2);
}
.rc-chip:hover { background: var(--glass-200); color: var(--ink) !important; transform: translateY(-1px); }

/* ---------- Action card ---------- */
.rc-card {
  position: relative; min-width: 0; display: flex; flex-direction: column;
  padding: var(--space-5) var(--space-5) 0; border-radius: var(--radius-lg);
  color: var(--ink); font-family: var(--font-sans);
  transition: transform var(--rc-dur-2) var(--rc-ease), box-shadow var(--rc-dur-2), opacity 180ms;
}
.rc-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.rc-card.is-solved { box-shadow: var(--shadow-card), 0 0 0 1.5px var(--ready); background: linear-gradient(var(--ready-soft), var(--ready-soft)), var(--glass-200); }
.rc-card.is-escalating { opacity: 0; transform: scale(.98); }
.rc-card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-3); }
.rc-card-kind {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px;
  border-radius: var(--radius-pill); border: 1px solid var(--hairline); background: var(--glass-100);
  font: 500 12px/16px var(--font-sans); letter-spacing: .02em; color: var(--ink-muted);
}
.rc-card-meta { font: 400 12px/16px var(--font-mono); color: var(--ink-muted); }
.rc-card-title { margin: 0; font: 600 17px/24px var(--font-sans); letter-spacing: -0.01em; color: var(--ink); }
.rc-card-source { margin: 4px 0 0; font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.rc-card-body { margin-top: var(--space-4); flex: 1; font: 400 14px/20px var(--font-sans); }

/* ---------- Feedback bar ---------- */
.rc-fb {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
  margin: var(--space-4) calc(-1 * var(--space-5)) 0; padding: 8px 10px 8px var(--space-5);
  border-top: 1px solid var(--hairline); min-height: 48px;
}
.rc-fb-q { font: 400 12px/16px var(--font-sans); color: var(--ink-faint); white-space: nowrap; }
.rc-card { container-type: inline-size; container-name: rc-card; }
@container rc-card (max-width: 419px) {
  .rc-fb { padding-left: 10px; }
  .rc-fb-q { display: none; }
  .rc-fb-actions { flex: 1; justify-content: space-between; }
}
.rc-fb-actions { display: flex; gap: 2px; }
.rc-fb-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; cursor: pointer;
  border-radius: var(--radius-pill); border: 1px solid transparent; background: none;
  font: 500 12.5px/1 var(--font-sans) !important; color: var(--ink-muted) !important; white-space: nowrap;
  transition: background var(--rc-dur-2), color var(--rc-dur-2), border-color var(--rc-dur-2);
}
.rc-fb-solved:hover:not(:disabled) { color: var(--ready) !important; background: var(--ready-soft); }
.rc-fb-expert:hover:not(:disabled) { color: var(--escalate) !important; background: var(--escalate-soft); }
.rc-fb-btn:disabled { cursor: default; }
.rc-fb.is-solved { justify-content: flex-start; gap: var(--space-2); font: 500 12.5px/16px var(--font-sans); color: var(--ready); }
.rc-fb-tick { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--ready); color: var(--ready-ink); animation: rc-pop 420ms var(--rc-ease-out) both; }
.rc-fb-undo { margin-left: auto; border: 0; background: none; cursor: pointer; padding: 6px 10px; border-radius: var(--radius-pill); font: 500 12px/1 var(--font-sans) !important; color: var(--ink-muted) !important; }
.rc-fb-undo:hover { background: var(--glass-100); color: var(--ink) !important; }
@keyframes rc-pop { 0% { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }

/* ---------- Video player card ---------- */
.rc-video { position: relative; aspect-ratio: 16 / 9; border-radius: var(--radius-md); overflow: hidden; background: var(--screen); color: var(--screen-ink); }
.rc-video-poster span { position: absolute; display: block; transition: transform 1.2s var(--rc-ease); }
.rc-vp-a { width: 46%; aspect-ratio: 1; left: 8%; top: 18%; border-radius: 50%; background: var(--ready); opacity: .22; }
.rc-vp-b { width: 40%; height: 46%; right: 9%; top: 16%; border-radius: var(--radius-md); background: var(--screen-ink); opacity: .1; }
.rc-vp-c { width: 18%; height: 9%; right: 21%; top: 68%; border-radius: var(--radius-pill); background: var(--ready); opacity: .9; }
.rc-video.is-playing .rc-vp-a { transform: translate(14%, -6%) scale(1.08); }
.rc-video.is-playing .rc-vp-b { transform: translate(-6%, 8%); }
.rc-video.is-playing .rc-vp-c { transform: translate(-30%, -40%); }
.rc-video-poster .rc-video-chapter {
  left: 12px; top: 10px; font: 500 11px/14px var(--font-mono); letter-spacing: .04em; color: var(--screen-ink); opacity: .8;
}
.rc-video-play {
  position: absolute; left: 50%; top: 46%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; cursor: pointer;
  display: grid; place-items: center; border: 1px solid rgba(255,255,255,.22); color: var(--screen-ink) !important;
  background: rgba(255,255,255,.14); -webkit-backdrop-filter: blur(var(--blur-glass)); backdrop-filter: blur(var(--blur-glass));
  transition: transform var(--rc-dur-1) var(--rc-ease), opacity var(--rc-dur-2);
}
.rc-video-play:hover { transform: scale(1.07); }
.rc-video.is-playing .rc-video-play { opacity: 0; }
.rc-video.is-playing:hover .rc-video-play { opacity: 1; }
.rc-video-bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.rc-video-track { position: relative; flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); }
.rc-video-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--ready); transition: width 250ms linear; }
.rc-video-tick { position: absolute; top: -2px; width: 2px; height: 8px; border-radius: 1px; background: var(--screen-ink); opacity: .55; }
.rc-video-time { font: 400 11px/14px var(--font-mono); color: var(--screen-ink); white-space: nowrap; }
.rc-chapters { list-style: none; margin: var(--space-3) 0 0; padding: 0; display: grid; gap: 2px; }
.rc-chapter {
  width: 100%; display: flex; gap: var(--space-3); align-items: baseline; text-align: left; cursor: pointer;
  padding: 6px 8px; margin: 0 -8px; border: 0; border-radius: var(--radius-sm); background: none;
  font: 400 14px/20px var(--font-sans) !important; color: var(--ink-muted) !important; transition: background var(--rc-dur-1);
}
.rc-chapter:hover { background: var(--glass-100); color: var(--ink) !important; }
.rc-chapter.is-current { color: var(--ink) !important; }
.rc-chapter-t { font: 400 12px/20px var(--font-mono); color: var(--ink-faint); min-width: 38px; }
.rc-chapter.is-current .rc-chapter-t { color: var(--ready); }

/* ---------- PDF summary card ---------- */
.rc-doc-file { display: flex; align-items: center; gap: var(--space-3); padding: 10px 12px 10px 10px; border-radius: var(--radius-sm); background: var(--glass-100); border: 1px solid var(--hairline); }
.rc-doc-thumb { width: 32px; height: 40px; flex: none; border-radius: 5px; background: var(--ground-raised); border: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 4px; padding: 8px 6px; }
.rc-doc-thumb i { display: block; height: 2px; border-radius: 2px; background: var(--ink-faint); }
.rc-doc-thumb i:nth-child(1) { background: var(--ready); width: 60%; }
.rc-doc-thumb i:nth-child(3) { width: 80%; }
.rc-doc-thumb i:nth-child(4) { width: 50%; }
.rc-doc-filetext { min-width: 0; flex: 1; }
.rc-doc-name { font: 400 12px/16px var(--font-mono); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-doc-sub { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.rc-doc-open { color: var(--ink-muted); }
.rc-doc-label { margin: var(--space-4) 0 var(--space-2); font: 500 12px/16px var(--font-sans); letter-spacing: .02em; color: var(--ink-faint); }
.rc-doc-points { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rc-doc-points li { display: grid; grid-template-columns: 6px 1fr auto; gap: 10px; align-items: start; }
.rc-doc-dot { width: 6px; height: 6px; margin-top: 7px; border-radius: 50%; background: var(--ready); }
.rc-doc-text { font: 400 14px/20px var(--font-sans); color: var(--ink); }
.rc-doc-page { font: 400 11px/14px var(--font-mono); color: var(--ink-muted); padding: 2px 6px; margin-top: 1px; border-radius: var(--radius-pill); border: 1px solid var(--hairline); }
.rc-link { margin-top: var(--space-3); padding: 0; border: 0; background: none; cursor: pointer; font: 500 13px/18px var(--font-sans) !important; color: var(--ready) !important; }
.rc-link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Steps card ---------- */
.rc-steps-meter { height: 3px; border-radius: 3px; background: var(--haze); overflow: hidden; }
.rc-steps-meter span { display: block; height: 100%; background: var(--ready); border-radius: 3px; transition: width var(--rc-dur-3) var(--rc-ease-out); }
.rc-steps { list-style: none; margin: var(--space-3) 0 0; padding: 0; }
.rc-step { width: 100%; display: flex; gap: var(--space-3); align-items: flex-start; text-align: left; cursor: pointer; padding: 8px; margin: 0 -8px; border: 0; border-radius: var(--radius-sm); background: none; transition: background var(--rc-dur-1); }
.rc-step:hover { background: var(--glass-100); }
.rc-step-box {
  width: 24px; height: 24px; flex: none; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid var(--ink-faint); font: 500 11px/1 var(--font-mono); color: var(--ink-muted);
  transition: background var(--rc-dur-2), border-color var(--rc-dur-2), color var(--rc-dur-2);
}
.rc-step.is-done .rc-step-box { background: var(--ready); border-color: var(--ready); color: var(--ready-ink); animation: rc-pop 380ms var(--rc-ease-out); }
.rc-step-text { display: grid; gap: 2px; padding-top: 2px; }
.rc-step-label { font: 400 14px/20px var(--font-sans); color: var(--ink); }
.rc-step.is-done .rc-step-label { color: var(--ink-muted); text-decoration: line-through; text-decoration-color: var(--ink-faint); }
.rc-step-detail { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }

/* ---------- Ticket chip ---------- */
.rc-ticket {
  position: relative; width: 264px; height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 16px 0 12px;
  border-radius: var(--radius-md); background: var(--escalate); color: var(--escalate-ink); box-shadow: var(--shadow-lift);
  font-family: var(--font-sans);
}
.rc-ticket-icon { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; }
.rc-ticket-notch { position: absolute; left: 56px; top: 9px; bottom: 9px; border-left: 1.5px dashed currentColor; opacity: .4; }
.rc-ticket-body { min-width: 0; padding-left: 6px; }
.rc-ticket-id { font: 500 11px/14px var(--font-mono); letter-spacing: .04em; }
.rc-ticket-title { font: 600 13.5px/18px var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Escalation flight ---------- */
.rc-flight { position: absolute; inset: 0; pointer-events: none; z-index: var(--z-flight); }
.rc-flight-trail { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; opacity: 0; }
.rc-flight-path { fill: none; stroke: var(--escalate); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 1 7; }
.rc-flight-ghost {
  position: absolute; overflow: hidden; transform-origin: 50% 50%; will-change: transform, left, top, width, height;
  border-radius: var(--radius-lg); border: 1px solid var(--glass-edge); background: var(--glass-300); box-shadow: var(--shadow-lift);
  -webkit-backdrop-filter: blur(var(--blur-heavy)); backdrop-filter: blur(var(--blur-heavy));
}
.rc-flight-card { position: absolute; inset: 0; padding: var(--space-5); display: grid; align-content: start; gap: var(--space-3); transform-origin: 50% 30%; }
.rc-flight-card .rc-card-kind { justify-self: start; }
.rc-flight-ticket { position: absolute; left: 50%; top: 50%; width: 264px; height: 60px; margin: -30px 0 0 -132px; opacity: 0; }
.rc-flight-ring { position: absolute; width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--escalate); opacity: 0; transform: translate(-50%, -50%); }

/* ---------- Escalated receipt (what stays in the card's slot) ---------- */
.rc-receipt {
  display: grid; gap: var(--space-3); padding: var(--space-5); border-radius: var(--radius-lg);
  border: 1.5px dashed var(--escalate); background: var(--escalate-soft); color: var(--ink); font-family: var(--font-sans);
  animation: rc-receipt-in 520ms var(--rc-ease-out) both;
}
@keyframes rc-receipt-in { from { opacity: 0; transform: scale(.96); } }
.rc-receipt-head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); }
.rc-receipt-tag { display: inline-flex; align-items: center; gap: 6px; font: 600 13px/18px var(--font-sans); color: var(--escalate); }
.rc-receipt-id { font: 500 11px/14px var(--font-mono); letter-spacing: .04em; color: var(--escalate); }
.rc-receipt-title { font: 600 15px/22px var(--font-sans); color: var(--ink); }
.rc-receipt-person { display: flex; gap: var(--space-3); align-items: center; padding: 10px; border-radius: var(--radius-sm); background: var(--glass-100); border: 1px solid var(--hairline); }
.rc-receipt-name { font: 600 13px/18px var(--font-sans); }
.rc-receipt-sub { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.rc-receipt-track { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.rc-receipt-track li { position: relative; padding-top: 12px; font: 500 12px/16px var(--font-sans); color: var(--ink-faint); }
.rc-receipt-track li::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; border-radius: 4px; background: var(--haze); }
.rc-receipt-track li.is-done { color: var(--ink-muted); }
.rc-receipt-track li.is-done::before { background: var(--escalate); }
.rc-receipt-track li.is-now { color: var(--ink); }
.rc-receipt-track li.is-now::before { background: var(--escalate); animation: rc-breathe 1.4s ease-in-out infinite; }
@keyframes rc-breathe { 50% { opacity: .35; } }
.rc-receipt-actions { display: flex; justify-content: space-between; }
.rc-avatar {
  width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center;
  background: var(--haze); color: var(--ink); font: 600 11px/1 var(--font-sans); letter-spacing: .02em;
}
.rc-quiet {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; margin: 0 -10px; cursor: pointer;
  border: 0; border-radius: var(--radius-pill); background: none; font: 500 12.5px/1 var(--font-sans) !important; color: var(--ink-muted) !important;
}
.rc-quiet:hover { background: var(--glass-100); color: var(--ink) !important; }
.rc-quiet .rc-kbd { margin-left: 4px; padding: 1px 6px; font-size: 11px; }

/* ---------- Manager dashboard dock ---------- */
.rc-dock { position: relative; width: 100%; border-radius: var(--radius-lg); padding: 10px 12px 10px 10px; color: var(--ink); font-family: var(--font-sans); transition: box-shadow var(--rc-dur-2); }
.rc-dock.is-open { box-shadow: var(--shadow-lift); }
.rc-dock-head { display: flex; align-items: center; gap: 10px; }
.rc-dock-icon { width: 34px; height: 34px; flex: none; border-radius: var(--radius-sm); display: grid; place-items: center; background: var(--glass-100); border: 1px solid var(--hairline); color: var(--ink-muted); }
.rc-dock-text { min-width: 0; flex: 1; }
.rc-dock-title { font: 600 13px/18px var(--font-sans); }
.rc-dock-sub { font: 400 11.5px/16px var(--font-sans); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-dock-count {
  min-width: 26px; height: 26px; padding: 0 8px; border-radius: var(--radius-pill); display: grid; place-items: center;
  background: var(--escalate); color: var(--escalate-ink); font: 600 12px/1 var(--font-mono); animation: rc-pop 520ms var(--rc-ease-out) both;
}
.rc-dock-count.is-zero { background: var(--glass-100); color: var(--ink-muted); box-shadow: inset 0 0 0 1px var(--hairline); animation: none; }
.rc-dock-drawer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--rc-dur-3) var(--rc-ease-out); }
.rc-dock.is-open .rc-dock-drawer { grid-template-rows: 1fr; }
.rc-dock-drawer > * { overflow: hidden; min-height: 0; }
.rc-dock-list { list-style: none; margin: 0; padding: 0; }
.rc-dock.is-open .rc-dock-list, .rc-dock.is-open .rc-dock-empty { margin-top: 10px; border-top: 1px solid var(--hairline); padding-top: 6px; }
.rc-dock-item { display: grid; grid-template-columns: 8px auto 1fr auto; align-items: center; gap: 8px; padding: 6px 2px; font: 400 12px/16px var(--font-sans); animation: rc-receipt-in 420ms var(--rc-ease-out) both; }
.rc-dock-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--escalate); }
.rc-dock-dot.is-assigned { background: var(--ready); }
.rc-dock-id { font: 500 11px/14px var(--font-mono); color: var(--ink-muted); }
.rc-dock-it { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-dock-st { font: 500 11px/14px var(--font-sans); color: var(--escalate); }
.rc-dock-st.is-assigned { color: var(--ready); }
.rc-dock-empty { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.rc-dock-ring { position: absolute; inset: -1px; border-radius: inherit; pointer-events: none; }
.rc-dock-ring.is-hit { animation: rc-hit 900ms var(--rc-ease-out); }
@keyframes rc-hit { 0% { box-shadow: 0 0 0 0 var(--escalate); } 100% { box-shadow: 0 0 0 18px transparent; } }

/* ---------- Knowledge canvas (Design View 1) ---------- */
.rc-canvas {
  position: relative; width: 100%; overflow: hidden; overflow: clip; isolation: isolate;
  background: var(--ground); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased;
}
.rc-canvas-orb { position: absolute; z-index: -1; border-radius: 50%; pointer-events: none; filter: blur(100px); }
.rc-canvas-orb-a { width: 640px; height: 640px; left: -200px; top: -260px; background: var(--orb-a); }
.rc-canvas-orb-b { width: 560px; height: 560px; right: -180px; bottom: -260px; background: var(--orb-b); }
.rc-topbar { position: absolute; left: var(--space-6); right: var(--space-6); top: 18px; height: 60px; display: flex; align-items: flex-start; justify-content: space-between; z-index: var(--z-dock); }
.rc-brand { display: flex; align-items: center; gap: 10px; height: 60px; }
.rc-brand-mark { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--ready); color: var(--ready-ink); }
.rc-brand-name { font: 600 16px/1 var(--font-sans); letter-spacing: -0.01em; }
.rc-brand-space { font: 400 13px/1 var(--font-sans); color: var(--ink-muted); padding-left: 10px; border-left: 1px solid var(--hairline); }
.rc-topbar-right { display: flex; align-items: flex-start; gap: var(--space-4); }
.rc-user { display: flex; align-items: center; gap: 10px; height: 60px; }
.rc-user-n { font: 600 13px/18px var(--font-sans); }
.rc-user-s { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.rc-dock-slot { width: 300px; }

.rc-hello { position: absolute; left: 50%; top: 196px; width: 760px; margin-left: -380px; text-align: center; transition: opacity 360ms var(--rc-ease), transform 560ms var(--rc-ease-out); }
.rc-hello-h { margin: 0; font: 400 56px/60px var(--font-display); letter-spacing: -0.01em; color: var(--ink); }
.rc-hello-s { margin: 14px auto 0; max-width: 520px; font: 400 15px/22px var(--font-sans); color: var(--ink-muted); }
.rc-canvas.is-active .rc-hello { opacity: 0; transform: translateY(-40px) scale(.98); pointer-events: none; }

.rc-omni-wrap { position: absolute; left: 50%; top: 360px; width: 720px; margin-left: -360px; z-index: var(--z-omni); transition: top 680ms var(--rc-ease-out), width 680ms var(--rc-ease-out), margin 680ms var(--rc-ease-out); }
.rc-canvas.is-active .rc-omni-wrap { top: 92px; width: 640px; margin-left: -320px; }

.rc-results-head { position: absolute; z-index: 2; left: 50%; top: var(--rc-head-top, 172px); width: 1120px; margin-left: -560px; display: flex; justify-content: space-between; align-items: center; animation: rc-fade 420ms var(--rc-ease) both; }
.rc-results-h { font: 600 15px/22px var(--font-sans); color: var(--ink); }
.rc-results-n { margin-left: 10px; font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
@keyframes rc-fade { from { opacity: 0; } }

.rc-grid { position: absolute; left: 50%; top: var(--rc-grid-top, 214px); width: 1120px; margin-left: -560px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); align-items: start; z-index: var(--z-widget); perspective: 1400px; }
.rc-canvas.is-single .rc-grid, .rc-canvas.is-single .rc-results-head { width: 560px; margin-left: -280px; }
.rc-canvas.is-single .rc-grid { grid-template-columns: minmax(0, 1fr); }
.rc-canvas.is-single .rc-results-head { align-items: flex-end; }
.rc-canvas.is-single .rc-results-n { display: block; margin: 2px 0 0; }
.rc-grid-item { animation: rc-rise 720ms var(--rc-ease-out) backwards; animation-delay: calc(var(--i, 0) * 90ms); }
@keyframes rc-rise { from { opacity: 0; transform: translateY(28px) rotateX(10deg) scale(.96); } }
.rc-skel { position: relative; height: 380px; border-radius: var(--radius-lg); background: var(--glass-100); border: 1px solid var(--hairline); overflow: hidden; padding: var(--space-5); display: grid; align-content: start; gap: 12px; }
.rc-skel span { display: block; height: 12px; border-radius: 6px; background: var(--haze); }
.rc-skel span:nth-child(1) { width: 30%; height: 22px; border-radius: var(--radius-pill); }
.rc-skel span:nth-child(2) { width: 82%; height: 16px; }
.rc-skel span:nth-child(3) { height: 160px; border-radius: var(--radius-md); }
.rc-skel::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, var(--glass-100) 50%, transparent 70%); animation: rc-shimmer 1.2s linear infinite; }
@keyframes rc-shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

.rc-ambient { position: absolute; left: var(--space-6); right: var(--space-6); bottom: var(--space-6); display: flex; justify-content: space-between; align-items: flex-end; gap: var(--space-6); transition: opacity 360ms var(--rc-ease), transform 560ms var(--rc-ease-out); }
.rc-canvas.is-active .rc-ambient { opacity: 0; transform: translateY(24px); pointer-events: none; }
.rc-ambient-w { display: flex; align-items: center; gap: var(--space-4); width: 280px; padding: var(--space-4); border-radius: var(--radius-lg); }
.rc-ambient-w:last-child { animation: rc-float 7s ease-in-out infinite; }
.rc-ambient-w:first-child { animation: rc-float 8s ease-in-out -3s infinite; }
@keyframes rc-float { 50% { transform: translateY(-6px); } }
.rc-ambient-hint { max-width: 360px; text-align: center; font: 400 13px/18px var(--font-sans); color: var(--ink-muted); padding-bottom: 8px; }
.rc-ambient-hint b { font-weight: 600; color: var(--ink); }
.rc-amb-k { font: 500 12px/16px var(--font-sans); letter-spacing: .02em; color: var(--ink-muted); }
.rc-amb-v { font: 600 15px/22px var(--font-sans); color: var(--ink); }
.rc-amb-big { font: 400 26px/1 var(--font-display); }
.rc-amb-s { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.rc-amb-icon { width: 44px; height: 44px; flex: none; border-radius: var(--radius-sm); display: grid; place-items: center; background: var(--glass-100); border: 1px solid var(--hairline); color: var(--ready); }
.rc-ring { flex: none; }
.rc-ring circle { fill: none; stroke-width: 5; }
.rc-ring-track { stroke: var(--haze); }
.rc-ring-fill { stroke: var(--ready); stroke-linecap: round; }

.rc-toast { position: absolute; left: 50%; bottom: 28px; z-index: var(--z-flight); transform: translateX(-50%); display: flex; align-items: center; gap: 12px; max-width: 720px; padding: 10px 8px 10px 16px; border-radius: var(--radius-pill); font: 400 13px/18px var(--font-sans); color: var(--ink); animation: rc-toast-in 520ms var(--rc-ease-out) both; }
@keyframes rc-toast-in { from { opacity: 0; transform: translate(-50%, 16px) scale(.97); } }
.rc-toast-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--escalate); box-shadow: 0 0 0 4px var(--escalate-soft); }
.rc-toast-id { font: 500 12px/16px var(--font-mono); color: var(--escalate); }
.rc-toast-x { width: 28px; height: 28px; flex: none; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; cursor: pointer; color: var(--ink-muted) !important; }
.rc-toast-x:hover { background: var(--glass-100); }

@media (prefers-reduced-motion: reduce) {
  .rc-canvas *, .rc-stage *, .rc-cc *, .rc-cc2 * { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}


/* ================= Design View 2 — Theme Command Center ================= */
.rc-cc {
  position: relative; overflow: hidden; isolation: isolate; width: 100%;
  display: grid; grid-template-columns: minmax(0, 1fr) 372px; grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top" "map side" "rooms side"; gap: var(--space-4); padding: var(--space-4) var(--space-6) var(--space-6);
  background: var(--ground); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased;
}
.rc-cc .rc-canvas-orb-a { left: -240px; top: -300px; }
.rc-panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-4); }
.rc-panel-h { margin: 0; display: flex; align-items: center; gap: var(--space-2); font: 600 15px/22px var(--font-sans); color: var(--ink); }
.rc-panel-s { margin: 2px 0 0; font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.rc-count { min-width: 22px; height: 22px; padding: 0 7px; border-radius: var(--radius-pill); display: inline-grid; place-items: center; background: var(--escalate); color: var(--escalate-ink); font: 600 12px/1 var(--font-mono); }
.rc-count.is-zero, .rc-count.is-neutral { background: var(--glass-100); color: var(--ink-muted); box-shadow: inset 0 0 0 1px var(--hairline); }

/* top bar */
.rc-cc-top { grid-area: top; display: flex; align-items: center; justify-content: space-between; gap: var(--space-5); min-height: 56px; }
.rc-cc-top .rc-brand { height: auto; }
.rc-kpis { display: flex; margin: 0; }
.rc-kpis > div { padding: 2px 18px; border-left: 1px solid var(--hairline); }
.rc-kpis > div:first-child { border-left: 0; }
.rc-kpis dt { font: 400 11.5px/16px var(--font-sans); color: var(--ink-muted); white-space: nowrap; }
.rc-kpis dd { margin: 0; font: 600 20px/26px var(--font-sans); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.rc-kpis .is-hot dd { color: var(--escalate); }
.rc-live { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; margin-right: 4px; border-radius: var(--radius-pill); background: var(--ready-soft); color: var(--ready); font: 500 12px/1 var(--font-sans); }
.rc-live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ready); animation: rc-breathe 1.6s ease-in-out infinite; }

/* themes panel */
.rc-cc-map { grid-area: map; min-height: 0; display: flex; flex-direction: column; padding: var(--space-5); border-radius: var(--radius-lg); }
.rc-cc-mapbody { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--space-5); margin-top: var(--space-3); }
.rc-cc-mapcol { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.rc-seg { display: inline-flex; flex: none; padding: 3px; border-radius: var(--radius-pill); background: var(--glass-100); border: 1px solid var(--hairline); }
.rc-seg button { height: 28px; padding: 0 14px; border: 0; border-radius: var(--radius-pill); background: none; cursor: pointer; font: 500 12.5px/1 var(--font-sans) !important; color: var(--ink-muted) !important; }
.rc-seg button.is-on { background: var(--glass-300); color: var(--ink) !important; box-shadow: var(--shadow-card); }
.rc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: var(--space-2); font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.rc-legend-i { display: inline-flex; align-items: center; gap: 6px; }
.rc-state-dot { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; }
.rc-state-dot.is-urgent { background: var(--escalate); }
.rc-state-dot.is-waiting { background: var(--escalate-soft); box-shadow: inset 0 0 0 1.5px var(--escalate); }
.rc-state-dot.is-room { background: var(--glass-300); box-shadow: inset 0 0 0 1.5px var(--ink-muted); }
.rc-state-dot.is-calm { background: var(--ready); }

.rc-map-field { position: relative; flex: 1; min-height: 0; }
.rc-map-stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.rc-map-inner { position: absolute; left: 0; top: 0; width: 620px; height: 380px; transform-origin: 0 0; }
.rc-bubble {
  position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: 8px; border-radius: 50%; border: 1.5px solid transparent; cursor: pointer; color: var(--ink);
  transition: transform var(--rc-dur-2) var(--rc-ease), box-shadow var(--rc-dur-2), background var(--rc-dur-3), border-color var(--rc-dur-3);
  animation: rc-bubble-in 700ms var(--rc-ease-out) backwards;
}
@keyframes rc-bubble-in { from { opacity: 0; transform: scale(.55); } }
.rc-bubble:hover { transform: scale(1.04); }
.rc-bubble-n { font-family: var(--font-display); line-height: 1; letter-spacing: -0.01em; font-variant-numeric: lining-nums; }
.rc-bubble-l { max-width: 86%; margin-top: 4px; font: 500 12px/15px var(--font-sans); text-wrap: balance; }
.rc-bubble.is-small .rc-bubble-l { font-size: 11px; line-height: 13px; }
.rc-bubble-w { margin-top: 4px; font: 500 11px/14px var(--font-mono); }
.rc-bubble.is-urgent { background: var(--escalate); color: var(--escalate-ink); }
.rc-bubble.is-urgent::after { content: ''; position: absolute; inset: -7px; border-radius: 50%; border: 1.5px solid var(--escalate); animation: rc-urgent 2.2s ease-out infinite; pointer-events: none; }
@keyframes rc-urgent { 0% { transform: scale(.95); opacity: .9; } 100% { transform: scale(1.16); opacity: 0; } }
.rc-bubble.is-waiting { background: var(--escalate-soft); border-color: var(--escalate); }
.rc-bubble.is-waiting .rc-bubble-w { color: var(--escalate); }
.rc-bubble.is-room { background: var(--glass-300); border-color: var(--ink-muted); }
.rc-bubble.is-room .rc-bubble-w { color: var(--ink-muted); }
.rc-bubble.is-calm { background: var(--ready-soft); }
.rc-bubble.is-calm .rc-bubble-n { color: var(--ready); }
.rc-bubble.is-selected { box-shadow: 0 0 0 3px var(--ground), 0 0 0 5px var(--ink); }
.rc-bubble.is-droppable { outline: 1.5px dashed var(--ink-faint); outline-offset: 5px; }
.rc-bubble.is-over { transform: scale(1.08); outline-color: var(--ready); outline-style: solid; outline-width: 2px; }
.rc-bubble-pic { position: absolute; top: 2%; right: 2%; box-shadow: 0 0 0 2px var(--ground); }

.rc-heat { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 4px; }
.rc-heat-row {
  width: 100%; display: grid; grid-template-columns: 172px repeat(7, minmax(0, 1fr)) 76px; gap: 4px; align-items: center;
  padding: 3px 6px; border-radius: var(--radius-sm); border: 1px solid transparent; background: none; text-align: left; cursor: pointer; color: var(--ink);
}
.rc-heat-head { cursor: default; font: 400 11px/16px var(--font-mono); color: var(--ink-faint); }
.rc-heat-row:not(.rc-heat-head):hover, .rc-heat-row.is-selected { background: var(--glass-100); border-color: var(--hairline); }
.rc-heat-row.is-droppable { border-style: dashed; border-color: var(--ink-faint); }
.rc-heat-row.is-over { border-color: var(--ready); border-style: solid; box-shadow: 0 0 0 3px var(--ready-soft); }
.rc-heat-name { display: flex; align-items: center; gap: 8px; min-width: 0; font: 500 13px/18px var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-heat-hr { text-align: center; }
.rc-heat-cell { position: relative; height: 30px; border-radius: 6px; background: var(--haze); overflow: hidden; display: grid; place-items: center; }
.rc-heat-fill { position: absolute; inset: 0; background: var(--ink); }
.rc-heat-n { position: relative; font: 500 12px/16px var(--font-mono); color: var(--ink); mix-blend-mode: normal; }
.rc-heat-cell.is-deep .rc-heat-n { color: var(--ground); }
.rc-heat-scale { flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 6px; padding-right: 6px; font: 400 11.5px/16px var(--font-sans); color: var(--ink-muted); }
.rc-heat-scale i { width: 96px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--haze), var(--ink)); }
.rc-heat-tot { text-align: right; font: 500 12px/16px var(--font-mono); font-variant-numeric: tabular-nums; }
.rc-heat-head .rc-heat-tot { white-space: nowrap; }
.rc-heat-w { display: block; font: 500 10.5px/13px var(--font-mono); color: var(--escalate); }

.rc-detail { position: relative; min-height: 0; overflow-x: hidden; overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); border-radius: var(--radius-md); background: var(--glass-100); border: 1px solid var(--hairline); transition: border-color var(--rc-dur-2), box-shadow var(--rc-dur-2); }
.rc-detail.is-droppable { border-style: dashed; border-color: var(--ink-faint); }
.rc-detail.is-over { border-style: solid; border-color: var(--ready); box-shadow: 0 0 0 3px var(--ready-soft); }
.rc-detail-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.rc-state { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: var(--radius-pill); background: var(--glass-100); border: 1px solid var(--hairline); font: 500 12px/16px var(--font-sans); color: var(--ink-muted); white-space: nowrap; }
.rc-state.is-urgent, .rc-state.is-waiting { color: var(--escalate); }
.rc-state.is-calm { color: var(--ready); }
.rc-state.is-room { color: var(--ink); }
.rc-detail-ai { font: 400 10.5px/14px var(--font-mono); color: var(--ink-faint); text-align: right; }
.rc-detail-h { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: end; font: 400 14px/19px var(--font-sans); color: var(--ink-muted); }
.rc-detail-h b { font-weight: 600; color: var(--ink); }
.rc-detail-n { font: 400 52px/0.9 var(--font-display); color: var(--ink); }
.rc-detail.is-urgent .rc-detail-n { color: var(--escalate); }
.rc-detail-sum { margin: 0; font: 400 13.5px/20px var(--font-sans); color: var(--ink); }
.rc-detail-stats { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.9fr); gap: 6px; }
.rc-detail-stats div { padding: 7px 10px; border-radius: var(--radius-sm); background: var(--glass-100); border: 1px solid var(--hairline); min-width: 0; }
.rc-detail-stats dt { font: 400 11px/14px var(--font-sans); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-detail-stats dd { margin: 2px 0 0; font: 600 16px/20px var(--font-sans); font-variant-numeric: tabular-nums; }
.rc-detail-stats dd.is-hot { color: var(--escalate); }
.rc-detail-stats .rc-stat-wk dt { white-space: normal; }
.rc-detail-stats dd small { margin-left: 8px; font: 400 11.5px/16px var(--font-mono); color: var(--ink-muted); }
.rc-spark { flex: none; height: 52px; display: flex; align-items: stretch; gap: 6px; }
.rc-spark-day { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.rc-spark-pair { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 2px; }
.rc-spark-pair span { flex: 1; max-width: 12px; border-radius: 3px 3px 1px 1px; background: var(--ink-muted); }
.rc-spark-pair span.is-prev { background: var(--haze); box-shadow: inset 0 0 0 1px var(--hairline); }
.rc-spark-day i { font: 400 10.5px/12px var(--font-mono); font-style: normal; color: var(--ink-faint); }
.rc-spark-key { flex: none; margin: -4px 0 0; display: flex; gap: 14px; font: 400 11px/14px var(--font-sans); color: var(--ink-muted); }
.rc-spark-key span { display: inline-flex; align-items: center; gap: 6px; }
.rc-spark-key i { width: 9px; height: 9px; border-radius: 2px; background: var(--ink-muted); }
.rc-spark-key i.is-prev { background: var(--haze); box-shadow: inset 0 0 0 1px var(--ink-faint); }
.rc-spark-axis { position: relative; height: 14px; margin-top: -6px; font: 400 10.5px/14px var(--font-mono); color: var(--ink-faint); }
.rc-spark-axis span { position: absolute; top: 0; }
.rc-spark-axis span:nth-child(1) { left: 0; }
.rc-spark-axis span:nth-child(2) { left: 77.3%; transform: translateX(-50%); color: var(--ink-muted); }
.rc-spark-axis span:nth-child(3) { right: 0; }
.rc-detail-asked { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rc-detail-asked li { padding-left: 10px; border-left: 2px solid var(--hairline); font: 400 12.5px/18px var(--font-sans); color: var(--ink-muted); }
.rc-detail-drop { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); border: 1.5px dashed var(--ink-faint); font: 400 12.5px/17px var(--font-sans); color: var(--ink-muted); }
.rc-detail-drop.is-done { border-style: solid; border-color: var(--hairline); background: var(--glass-100); color: var(--ink); }
.rc-detail-drop b { font: 500 12px/17px var(--font-mono); }
.rc-cc.is-assigning .rc-detail-drop:not(.is-done) { border-color: var(--ready); color: var(--ready); }

/* people */
.rc-pic { display: inline-grid; place-items: center; flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--ground); font: 600 11px/1 var(--font-sans); letter-spacing: .02em; }
.rc-person { width: 26px; height: 26px; font-size: 9.5px; }

/* sidebar */
.rc-cc-side { grid-area: side; min-height: 0; display: flex; flex-direction: column; gap: var(--space-5); padding: var(--space-5); border-radius: var(--radius-lg); }
.rc-roster-list { list-style: none; margin: var(--space-3) 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.rc-pic-chip {
  width: 100%; display: grid; justify-items: center; gap: 4px; padding: 10px 2px 8px; border-radius: var(--radius-md);
  border: 1px solid transparent; background: none; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; color: var(--ink);
  transition: background var(--rc-dur-2), border-color var(--rc-dur-2), opacity var(--rc-dur-2), transform var(--rc-dur-1) var(--rc-ease);
}
.rc-pic-chip .rc-pic { box-shadow: 0 0 0 2px var(--ground), 0 0 0 3.5px var(--glass-edge); transition: box-shadow var(--rc-dur-2); }
.rc-pic-chip:hover { background: var(--glass-100); border-color: var(--hairline); transform: translateY(-2px); }
.rc-pic-chip:hover .rc-pic, .rc-pic-chip.is-picked .rc-pic { box-shadow: 0 0 0 2px var(--ground), 0 0 0 4px var(--ready); }
.rc-pic-chip.is-picked { background: var(--ready-soft); border-color: var(--ready); }
.rc-pic-chip.is-lifted { opacity: .3; }
.rc-pic-name { font: 600 12px/16px var(--font-sans); }
.rc-pic-team { min-height: 26px; font: 400 10.5px/13px var(--font-sans); color: var(--ink-muted); text-align: center; }
.rc-load { display: flex; gap: 3px; }
.rc-load i { width: 6px; height: 6px; border-radius: 50%; background: var(--haze); }
.rc-load i.is-on { background: var(--ink-muted); }
html.rc-is-dragging, html.rc-is-dragging * { cursor: grabbing !important; user-select: none !important; -webkit-user-select: none !important; }

.rc-queue { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.rc-queue-scroll { flex: 1; min-height: 0; overflow: auto; margin: var(--space-2) -8px 0; padding: 0 8px 4px; }
.rc-qgroup { margin: 10px 0 8px; font: 500 11px/14px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); }
.rc-qgroup.is-over { color: var(--escalate); }
.rc-qlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.rc-qlist li.is-leaving { animation: rc-leave 420ms var(--rc-ease) forwards; pointer-events: none; }
@keyframes rc-leave { to { opacity: 0; transform: translateX(32px) scale(.96); } }
.rc-qitem {
  width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 12px; text-align: left; cursor: pointer;
  border-radius: var(--radius-md); background: var(--glass-100); border: 1px solid var(--hairline); color: var(--ink);
  transition: background var(--rc-dur-2), border-color var(--rc-dur-2), box-shadow var(--rc-dur-2), transform var(--rc-dur-1);
}
.rc-qitem:hover { background: var(--glass-200); }
.rc-qitem.is-overdue { background: var(--escalate-soft); border-color: var(--escalate); }
.rc-qitem.is-droppable { border-style: dashed; }
.rc-qitem.is-over { border-style: solid; border-color: var(--ready); box-shadow: 0 0 0 3px var(--ready-soft); transform: scale(1.01); }
.rc-qitem-body { min-width: 0; display: grid; gap: 2px; }
.rc-qitem-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rc-qitem-who { font: 600 13px/18px var(--font-sans); }
.rc-qitem-id { font: 400 11px/14px var(--font-mono); color: var(--ink-muted); }
.rc-qitem-role { font: 400 11.5px/15px var(--font-sans); color: var(--ink-muted); }
.rc-qitem-q { margin-top: 4px; font: 400 13px/18px var(--font-sans); color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rc-qitem-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px; }
.rc-tag { padding: 2px 8px; border-radius: var(--radius-pill); background: var(--glass-100); border: 1px solid var(--hairline); font: 500 11px/15px var(--font-sans); color: var(--ink-muted); }
.rc-qitem-from { font: 400 11px/15px var(--font-sans); color: var(--ink-muted); }
.rc-sla { position: relative; width: 34px; height: 34px; }
.rc-sla svg { display: block; }
.rc-sla circle { fill: none; stroke-width: 3; }
.rc-sla-track { stroke: var(--haze); }
.rc-sla-fill { stroke: var(--ink-muted); stroke-linecap: round; }
.rc-sla.is-over .rc-sla-fill { stroke: var(--escalate); }
.rc-sla-t { position: absolute; inset: 0; display: grid; place-items: center; font: 500 10px/1 var(--font-mono); }
.rc-sla.is-over .rc-sla-t { color: var(--escalate); }
.rc-queue-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--hairline); font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.rc-queue-foot b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.rc-queue-empty { display: flex; align-items: center; gap: 10px; margin-top: var(--space-4); padding: 14px; border-radius: var(--radius-md); background: var(--ready-soft); font: 500 13px/18px var(--font-sans); color: var(--ready); }

/* rooms */
.rc-cc-rooms { grid-area: rooms; padding: var(--space-5); border-radius: var(--radius-lg); }
.rc-rooms-right { display: flex; align-items: center; gap: var(--space-5); }
.rc-rooms .rc-legend { margin-top: 0; }
.rc-rooms-all { margin: 0; }
.rc-room-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3); margin-top: var(--space-4); }
.rc-room {
  min-width: 0; display: grid; gap: 8px; padding: 14px; border-radius: var(--radius-md); background: var(--glass-100); border: 1px solid var(--hairline);
  transition: border-color 1.2s, box-shadow 1.2s, opacity var(--rc-dur-2); animation: rc-room-in 560ms var(--rc-ease-out) backwards;
}
@keyframes rc-room-in { from { opacity: 0; transform: translateY(10px) scale(.96); } }
.rc-room.is-new { border-color: var(--ready); box-shadow: 0 0 0 3px var(--ready-soft); transition: none; }
.rc-room.is-resolved { opacity: .6; }
.rc-room-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rc-room-name { min-width: 0; font: 500 12.5px/16px var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-room-t { flex: none; font: 400 11px/14px var(--font-mono); color: var(--ink-muted); }
.rc-room-theme { margin-top: -4px; font: 400 12px/16px var(--font-sans); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-room-mid { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.rc-room-people { display: flex; align-items: center; min-width: 0; }
.rc-room-pic { margin-right: 4px; box-shadow: 0 0 0 2px var(--ground-raised); }
.rc-room-people .rc-person { margin-left: -4px; box-shadow: 0 0 0 2px var(--ground-raised); }
.rc-room-people .rc-room-pic + .rc-person { margin-left: 0; }
.rc-more { font: 500 9.5px/1 var(--font-mono) !important; color: var(--ink-muted); }
.rc-room-st { display: inline-flex; align-items: center; gap: 5px; font: 500 11.5px/14px var(--font-sans); white-space: nowrap; }
.rc-room-st i { width: 7px; height: 7px; border-radius: 50%; }
.rc-room-st.is-live { color: var(--ink); }
.rc-room-st.is-live i { background: var(--ready); animation: rc-breathe 1.6s ease-in-out infinite; }
.rc-room-st.is-waiting { color: var(--ink-muted); }
.rc-room-st.is-waiting i { background: var(--ink-faint); }
.rc-room-st.is-resolved { color: var(--ready); }
.rc-room-last { margin: 0; font: 400 12.5px/18px var(--font-sans); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* drag, drop, spawn */
.rc-drag-ghost { position: absolute; z-index: var(--z-flight); pointer-events: none; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 6px; }
.rc-drag-ghost .rc-pic { box-shadow: 0 0 0 3px var(--ground), var(--shadow-lift); transform: scale(1.08); }
.rc-drag-label { padding: 3px 10px; border-radius: var(--radius-pill); background: var(--ink); color: var(--ground); font: 600 11.5px/16px var(--font-sans); white-space: nowrap; }
.rc-drag-ghost.is-over .rc-drag-label { background: var(--ready); color: var(--ready-ink); }
.rc-drop-ripple { position: absolute; z-index: var(--z-flight); width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ready); pointer-events: none; transform: translate(-50%, -50%); animation: rc-ripple 700ms var(--rc-ease-out) forwards; }
@keyframes rc-ripple { from { opacity: 1; transform: translate(-50%, -50%) scale(.4); } to { opacity: 0; transform: translate(-50%, -50%) scale(3); } }
.rc-spawn-fly { position: absolute; z-index: var(--z-flight); pointer-events: none; transform: translate(-50%, -50%); }
.rc-spawn-fly .rc-pic { box-shadow: 0 0 0 3px var(--ground), var(--shadow-lift); }
.rc-toast-dot.is-ready { background: var(--ready); box-shadow: 0 0 0 4px var(--ready-soft); }
.rc-cc .rc-toast b { font: 500 12.5px/18px var(--font-mono); }

/* ---------- Mode switch (Employee / Manager) ---------- */
.rc-mode { display: inline-flex; padding: 3px; margin-left: 6px; border-radius: var(--radius-pill); background: var(--glass-100); border: 1px solid var(--glass-edge); -webkit-backdrop-filter: blur(var(--blur-glass)); backdrop-filter: blur(var(--blur-glass)); }
.rc-mode-b { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 14px 0 12px; border: 0; border-radius: var(--radius-pill); background: none; cursor: pointer; font: 500 13px/1 var(--font-sans) !important; color: var(--ink-muted) !important; transition: background var(--rc-dur-2), color var(--rc-dur-2); }
.rc-mode-b:hover { color: var(--ink) !important; }
.rc-mode-b.is-on { background: var(--ink); color: var(--ground) !important; }
.rc-mode-badge { min-width: 18px; height: 18px; padding: 0 5px; margin-left: 2px; border-radius: var(--radius-pill); display: inline-grid; place-items: center; background: var(--escalate); color: var(--escalate-ink); font: 600 11px/1 var(--font-mono); animation: rc-pop 420ms var(--rc-ease-out) both; }
.rc-dock.is-clickable { cursor: pointer; }
.rc-dock.is-clickable:hover { box-shadow: var(--shadow-lift); }
.rc-qitem.is-new { box-shadow: 0 0 0 3px var(--escalate-soft); border-color: var(--escalate); animation: rc-room-in 560ms var(--rc-ease-out) backwards; }
.rc-new { margin-right: 8px; padding: 1px 6px; border-radius: var(--radius-pill); background: var(--escalate); color: var(--escalate-ink); font: 600 10px/14px var(--font-sans); letter-spacing: .02em; }
.rc-mode-view { animation: rc-fade 360ms var(--rc-ease) both; }

/* ================= Ticket Room ================= */
.rc-roomlayer, .rc-roomlayer * { box-sizing: border-box; }
.rc-roomlayer { position: fixed; inset: 0; z-index: 60; display: flex; justify-content: flex-end; font-family: var(--font-sans); color: var(--ink); }
.rc-roomlayer :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
:where(.rc-roomlayer) button { font: inherit; color: inherit; }
.rc-roomlayer-scrim { position: absolute; inset: 0; background: var(--ground); opacity: .55; animation: rc-scrim 300ms var(--rc-ease) both; }
@keyframes rc-scrim { from { opacity: 0; } }
.rc-troom {
  position: relative; display: flex; flex-direction: column; width: min(520px, 100%); height: 100%;
  border-radius: var(--radius-xl) 0 0 var(--radius-xl); border-right: 0;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: rc-sheet 480ms var(--rc-ease-out) both;
}
@keyframes rc-sheet { from { transform: translateX(48px); opacity: 0; } }
.rc-troom-head { padding: var(--space-5) var(--space-5) var(--space-4); border-bottom: 1px solid var(--hairline); display: grid; gap: var(--space-3); }
.rc-troom-row { display: flex; align-items: center; gap: 10px; }
.rc-troom-name { font: 500 14px/20px var(--font-mono); }
.rc-troom-x { margin-left: auto; width: 34px; height: 34px; }
.rc-troom-people { display: flex; align-items: center; gap: 12px; }
.rc-troom-who { min-width: 0; flex: 1; }
.rc-troom-pn { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 600 14px/20px var(--font-sans); }
.rc-troom-role { padding: 1px 8px; border-radius: var(--radius-pill); background: var(--glass-100); border: 1px solid var(--hairline); font: 500 11px/16px var(--font-sans); color: var(--ink-muted); }
.rc-troom-ps { font: 400 12.5px/17px var(--font-sans); color: var(--ink-muted); }
.rc-troom-note { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); padding: 8px 10px; border-radius: var(--radius-sm); background: var(--glass-100); border: 1px dashed var(--hairline); }
.rc-solve { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px 0 12px; border-radius: var(--radius-pill); border: 1px solid var(--ready); background: var(--ready-soft); cursor: pointer; font: 600 12.5px/1 var(--font-sans) !important; color: var(--ready) !important; transition: background var(--rc-dur-2); }
.rc-solve:hover { background: var(--ready); color: var(--ready-ink) !important; }
.rc-troom-ctx { margin: var(--space-4) var(--space-5) 0; padding: 12px 14px; border-radius: var(--radius-md); background: var(--escalate-soft); border: 1px solid var(--hairline); }
.rc-troom-ctx-k { display: flex; align-items: center; gap: 6px; font: 500 11px/14px var(--font-mono); letter-spacing: .02em; color: var(--escalate); }
.rc-troom-ctx-q { margin: 6px 0 0; font: 400 13px/19px var(--font-sans); color: var(--ink); }
.rc-thread { flex: 1; min-height: 0; overflow-y: auto; list-style: none; margin: 0; padding: var(--space-4) var(--space-5); display: flex; flex-direction: column; gap: 14px; }
.rc-msg-sys { align-self: center; text-align: center; font: 400 11.5px/16px var(--font-sans); color: var(--ink-faint); }

.rc-msg-typing { display: flex; align-items: center; gap: 8px; font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.rc-dots { display: inline-flex; gap: 3px; padding: 8px 10px; border-radius: var(--radius-pill); background: var(--glass-200); }
.rc-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-muted); animation: rc-dot 1.1s ease-in-out infinite; }

.rc-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes rc-dot { 40% { transform: translateY(-3px); opacity: .5; } }
.rc-troom-compose { padding: var(--space-3) var(--space-5) var(--space-5); border-top: 1px solid var(--hairline); display: grid; gap: var(--space-3); }
.rc-troom-quick { display: flex; flex-wrap: wrap; gap: 6px; }

.rc-composer-input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: 400 15px/22px var(--font-sans); color: var(--ink); }

.rc-troom-done { display: flex; align-items: center; gap: 10px; margin: 0 var(--space-5) var(--space-5); padding: 14px; border-radius: var(--radius-md); background: var(--ready-soft); font: 500 13px/18px var(--font-sans); color: var(--ready); }

@media (max-width: 560px) { .rc-troom { width: 100%; border-radius: 0; } }

/* receipt with a room */
.rc-room-btn { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px 0 14px; border: 0; border-radius: var(--radius-pill); background: var(--ready); cursor: pointer; font: 600 12.5px/1 var(--font-sans) !important; color: var(--ready-ink) !important; animation: rc-pop 460ms var(--rc-ease-out) both; }
.rc-room-btn:hover { transform: translateY(-1px); }
.rc-room-btn.is-done { background: var(--glass-100); color: var(--ink) !important; box-shadow: inset 0 0 0 1px var(--hairline); animation: none; }
.rc-receipt.has-room { border-style: solid; border-color: var(--ready); background: var(--ready-soft); }
.rc-receipt.has-room .rc-receipt-tag, .rc-receipt.has-room .rc-receipt-id { color: var(--ready); }
.rc-receipt.has-room .rc-receipt-track li.is-done::before, .rc-receipt.has-room .rc-receipt-track li.is-now::before { background: var(--ready); }
.rc-receipt.is-done { border-style: solid; border-color: var(--hairline); background: var(--glass-100); }
.rc-receipt.is-done .rc-receipt-tag, .rc-receipt.is-done .rc-receipt-id { color: var(--ready); }
.rc-receipt.is-done .rc-receipt-track li::before { background: var(--ready); }
.rc-receipt-actions { align-items: center; }
.rc-room.is-clickable { text-align: left; cursor: pointer; color: var(--ink); font: inherit; }
.rc-room.is-clickable:hover { background: var(--glass-200); border-color: var(--glass-edge); transform: translateY(-2px); }

/* ================= Your questions (employee history sidebar) ================= */
@keyframes rc-hist-in { from { opacity: 0; transform: translateX(-12px); } }
.rc-hist-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; margin: 0 -6px; padding: 0 6px; }
.rc-hist-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
.rc-hist-li { border-radius: var(--radius-md); border: 1px solid transparent; transition: background var(--rc-dur-2), border-color var(--rc-dur-2); animation: rc-room-in 380ms var(--rc-ease-out) backwards; }
.rc-hist-li:hover { background: var(--glass-100); }
.rc-hist-li.is-active { background: var(--glass-200); border-color: var(--glass-edge); }
.rc-hist-item { width: 100%; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px; border: 0; background: none; text-align: left; cursor: pointer; color: var(--ink); }
.rc-hist-ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--glass-100); border: 1px solid var(--hairline); color: var(--ink-muted); }
.rc-hist-body { min-width: 0; display: grid; gap: 2px; }
.rc-hist-q { font: 500 13px/18px var(--font-sans); color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rc-hist-meta { font: 400 11.5px/15px var(--font-sans); color: var(--ink-muted); }
.rc-hist-ok { width: 20px; height: 20px; margin-top: 4px; border-radius: 50%; display: grid; place-items: center; background: var(--ready-soft); color: var(--ready); }
.rc-hist-room { width: auto; max-width: none; overflow: hidden; margin: -2px 10px 10px 48px; display: flex; align-items: center; gap: 6px; min-height: 28px; padding: 4px 8px 4px 9px; border-radius: var(--radius-pill); border: 1px solid var(--hairline); background: var(--glass-100); cursor: pointer; font: 500 11.5px/14px var(--font-sans) !important; color: var(--ink) !important; text-align: left; }
.rc-hist-room:disabled { cursor: default; }
.rc-hist-room .rc-hist-dot { width: 7px; height: 7px; flex: none; border-radius: 50%; }
.rc-hist-room.is-live { border-color: var(--ready); background: var(--ready-soft); }
.rc-hist-room.is-live .rc-hist-dot { background: var(--ready); animation: rc-breathe 1.6s ease-in-out infinite; }
.rc-hist-room.is-waiting { border-color: var(--escalate); background: var(--escalate-soft); color: var(--escalate) !important; }
.rc-hist-room.is-waiting .rc-hist-dot { background: var(--escalate); }
.rc-hist-room.is-solved { color: var(--ready) !important; }
.rc-hist-room:not(:disabled):hover { background: var(--glass-200); }
.rc-hist-rl { white-space: nowrap; }
.rc-hist-rn { min-width: 0; flex: 1; font: 400 11px/14px var(--font-mono); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-hist-room .rc-icon { margin-left: auto; color: var(--ink-muted); }
.rc-hist-unread { min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--radius-pill); display: inline-grid; place-items: center; background: var(--ready); color: var(--ready-ink); font: 600 10.5px/1 var(--font-mono); animation: rc-pop 420ms var(--rc-ease-out) both; }
.rc-hist-empty { display: grid; justify-items: start; gap: 8px; margin-top: var(--space-3); padding: 14px; border-radius: var(--radius-md); border: 1px dashed var(--hairline); font: 400 12.5px/18px var(--font-sans); color: var(--ink-muted); }
.rc-hist-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 4px 0; margin-top: 8px; border-top: 1px solid var(--hairline); font: 400 11.5px/16px var(--font-sans); color: var(--ink-faint); }
.rc-hist-foot .rc-quiet { margin: 0 -6px 0 0; height: 26px; font-size: 12px !important; }
.rc-quiet.is-warn { color: var(--escalate) !important; }


/* ================= Command Center v2: "What needs me right now?" ================= */
.rc-cc2 { position: relative; overflow: clip; isolation: isolate; width: 100%; display: grid; grid-template-columns: 256px minmax(0, 1fr); column-gap: var(--space-6); align-items: start; padding: var(--space-4) var(--space-4) var(--space-7); background: var(--ground); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }

.rc-cc2-main > .rc-kpi3 { justify-content: flex-end; }
/* vertical manager menu: brand, switch, pages, and the signed-in manager at the bottom */
.rc-side { position: sticky; top: var(--space-4); z-index: 5; display: flex; flex-direction: column; gap: var(--space-4); height: calc(100vh - 2 * var(--space-4)); min-height: 560px; padding: var(--space-4); border-radius: var(--radius-lg); background: var(--glass-200); border: 1px solid var(--glass-edge); box-shadow: var(--shadow-card); -webkit-backdrop-filter: blur(var(--blur-glass)) saturate(1.5); backdrop-filter: blur(var(--blur-glass)) saturate(1.5); overflow: hidden; isolation: isolate; }
.rc-side::after { content: ''; position: absolute; z-index: -1; left: -70px; bottom: -110px; width: 280px; height: 280px; border-radius: 50%; background: var(--ready-soft); filter: blur(46px); pointer-events: none; }
.rc-side-brand { height: auto; padding: 4px 6px 2px; }
.rc-side-cap { margin: 0; padding: 0 6px; font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.rc-side-mode .rc-mode { display: flex; width: 100%; margin: 0; }

.rc-side-user { height: auto; margin-top: auto; padding: var(--space-4) 6px 2px; border-top: 1px solid var(--hairline); }

.rc-kpi3 { display: flex; gap: var(--space-3); margin: 0; }
.rc-kpi { min-width: 150px; padding: 10px 18px; border-radius: var(--radius-md); background: var(--glass-100); border: 1px solid var(--hairline); }
.rc-kpi dt { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.rc-kpi dd { margin: 2px 0 0; font: 600 28px/32px var(--font-sans); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.rc-kpi.is-need { background: var(--escalate-soft); border-color: var(--escalate); }
.rc-kpi.is-need dt, .rc-kpi.is-need dd { color: var(--escalate); }
.rc-kpi.is-prog dd { color: var(--ready); }
.rc-tabs { display: flex; flex-direction: column; gap: 4px; margin-top: var(--space-2); }
.rc-tab { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border: 1px solid transparent; border-radius: var(--radius-md); background: none; cursor: pointer; text-align: left; font: 500 15px/22px var(--font-sans) !important; color: var(--ink-muted) !important; transition: background var(--rc-dur-2), color var(--rc-dur-2), border-color var(--rc-dur-2); }
.rc-tab .rc-icon { flex: none; }
.rc-tab-t { min-width: 0; }
.rc-tab:hover { color: var(--ink) !important; background: var(--glass-100); }
.rc-tab.is-on { color: var(--ink) !important; background: var(--ready-soft); border-color: var(--hairline); border-color: color-mix(in srgb, var(--ready) 32%, transparent); }
.rc-tab.is-on .rc-icon { color: var(--ready); }
.rc-tab-n { margin-left: auto; min-width: 24px; height: 22px; padding: 0 8px; display: inline-grid; place-items: center; border-radius: var(--radius-pill); background: var(--escalate-soft); color: var(--escalate); font: 600 12.5px/1 var(--font-sans); font-variant-numeric: tabular-nums; }
.rc-needs { display: grid; grid-template-columns: minmax(0, 65fr) minmax(0, 35fr); gap: var(--space-6); align-items: start; }
.rc-needs-main, .rc-needs-side { min-width: 0; }
.rc-needs-side { display: grid; gap: var(--space-5); }
.rc-sec-h { margin: 0; display: flex; align-items: center; gap: 10px; font: 600 19px/26px var(--font-sans); color: var(--ink); }
.rc-sec-h.is-small { font-size: 15px; line-height: 22px; }
.rc-sec-s { margin: 4px 0 var(--space-4); font: 400 15px/22px var(--font-sans); color: var(--ink-muted); }
.rc-sec-empty { margin: 0; font: 400 15px/22px var(--font-sans); color: var(--ink-muted); }
.rc-ai-label { display: inline-flex; align-items: center; align-self: flex-start; padding: 1px 8px; border-radius: var(--radius-pill); border: 1px solid var(--hairline); background: var(--glass-100); font: 600 10.5px/16px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }

.rc-need-list { display: grid; gap: var(--space-4); }
.rc-need { position: relative; display: grid; gap: 18px; padding: var(--space-6); border-radius: var(--radius-lg); background: var(--glass-200); border: 1px solid var(--glass-edge); box-shadow: var(--shadow-card); -webkit-backdrop-filter: blur(var(--blur-glass)) saturate(1.5); backdrop-filter: blur(var(--blur-glass)) saturate(1.5); animation: rc-room-in 480ms var(--rc-ease-out) backwards; }
.rc-need.is-overdue { border-color: var(--escalate); }
.rc-need.is-leaving { animation: rc-need-out 420ms var(--rc-ease) forwards; pointer-events: none; }
@keyframes rc-need-out { to { opacity: 0; transform: translateX(48px) scale(.98); } }
.rc-need-head { display: flex; align-items: flex-start; gap: 14px; }
.rc-need-dot { position: relative; flex: none; width: 12px; height: 12px; margin-top: 8px; border-radius: 50%; background: var(--escalate); }

.rc-need-ht { flex: 1; min-width: 0; }

.rc-need-p { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 14px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--hairline); }
.rc-need-p.is-new { animation: rc-room-in 560ms var(--rc-ease-out) backwards; }
.rc-need-p .rc-person { width: 36px; height: 36px; font-size: 12px; }
.rc-need-pb { min-width: 0; }
.rc-need-pt { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.rc-need-pn { font: 600 16px/24px var(--font-sans); }
.rc-need-pr { font: 400 14px/20px var(--font-sans); color: var(--ink-muted); }
.rc-need-pt .rc-new { margin: 0; align-self: center; }
.rc-need-w { margin-left: auto; font: 400 14px/20px var(--font-mono); color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.rc-need-w.is-over { color: var(--escalate); }
.rc-need-q { margin: 2px 0 0; font: 400 16px/24px var(--font-sans); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.rc-assign { display: grid; gap: 10px; }
.rc-assign-row { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.rc-btn-primary { display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px 0 10px; border: 0; border-radius: var(--radius-pill); background: var(--ready); cursor: pointer; font: 600 16px/1 var(--font-sans) !important; color: var(--ready-ink) !important; box-shadow: var(--shadow-card); transition: transform var(--rc-dur-1) var(--rc-ease), box-shadow var(--rc-dur-2); }
.rc-btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-lift); }

.rc-btn-ghost { display: inline-flex; align-items: center; gap: 6px; height: 48px; padding: 0 16px; border-radius: var(--radius-pill); border: 1px solid var(--glass-edge); background: var(--glass-100); cursor: pointer; font: 400 15px/1 var(--font-sans) !important; color: var(--ink) !important; }
.rc-btn-ghost:hover:not(:disabled) { background: var(--glass-200); }

.rc-chev-down { transform: rotate(90deg); }
.rc-chev-up { transform: rotate(-90deg); }
.rc-assign-why { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 400 14px/20px var(--font-sans); color: var(--ink-muted); }
.rc-menu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 45; width: min(380px, calc(100vw - 48px)); list-style: none; margin: 0; padding: 6px; border-radius: var(--radius-md); animation: rc-room-in 220ms var(--rc-ease-out) both; }
.rc-menu-i { width: 100%; display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px; border: 0; border-radius: var(--radius-sm); background: none; text-align: left; cursor: pointer; color: var(--ink); }
.rc-menu-i:hover, .rc-menu-i:focus-visible { background: var(--glass-100); }
.rc-menu-b { min-width: 0; display: grid; gap: 2px; }
.rc-menu-n { display: flex; align-items: center; gap: 8px; font: 600 15px/20px var(--font-sans); }
.rc-menu-s { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-menu-l { font: 400 12px/16px var(--font-mono); color: var(--ink-muted); white-space: nowrap; }

.rc-panel2 { padding: var(--space-5); border-radius: var(--radius-lg); }
.rc-panel2 .rc-sec-s { margin-bottom: var(--space-3); }
.rc-panel2-quiet { background: none; border: 1px dashed var(--hairline); }
.rc-prog-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }

.rc-prog-i { width: 100%; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--hairline); background: var(--glass-100); text-align: left; cursor: pointer; color: var(--ink); transition: background var(--rc-dur-2), border-color 1.2s, box-shadow 1.2s; }
.rc-prog-i:hover { background: var(--glass-200); }
.rc-prog-i.is-new { border-color: var(--ready); box-shadow: 0 0 0 3px var(--ready-soft); transition: none; animation: rc-room-in 480ms var(--rc-ease-out) backwards; }

.rc-prog-b { min-width: 0; display: grid; gap: 2px; }
.rc-prog-t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rc-prog-n { min-width: 0; font: 400 14px/20px var(--font-mono); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-prog-e { flex: none; font: 400 13px/18px var(--font-mono); color: var(--ink-muted); }
.rc-prog-m { font: 400 14px/20px var(--font-sans); color: var(--ink-muted); }
.rc-prog-l { font: 400 15px/22px var(--font-sans); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-link-btn { display: inline-flex; align-items: center; gap: 4px; margin-top: 12px; padding: 6px 0; border: 0; background: none; cursor: pointer; font: 400 14px/20px var(--font-sans) !important; color: var(--ink-muted) !important; }

.rc-cardchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.rc-cardchip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: var(--radius-pill); background: var(--glass-100); border: 1px solid var(--hairline); font: 400 14px/18px var(--font-sans); color: var(--ink-muted); }

.rc-footnote { margin: 0; display: flex; align-items: flex-start; gap: 8px; font: 400 13px/19px var(--font-sans); color: var(--ink-muted); }
.rc-footnote .rc-icon { margin-top: 2px; flex: none; }
.rc-allclear { display: flex; align-items: center; gap: 12px; padding: var(--space-6); border-radius: var(--radius-lg); background: var(--ready-soft); border: 1px solid var(--ready); font: 400 18px/26px var(--font-sans); color: var(--ink); }
.rc-trends { display: grid; gap: var(--space-4); }
.rc-trends .rc-cc-map { height: 690px; }
.rc-panel-h .rc-ai-label { margin-left: 4px; }
