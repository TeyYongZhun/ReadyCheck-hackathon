<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ReadyCheck architecture</title>
  <desc id="d">New hires and managers use the ReadyCheck web app (React, TypeScript, Vite) in the browser. Vercel serves the static site and runs one serverless API function with four endpoints: answer, theme-summary, room-reply and summarize-room. The function holds the Gemini API key, sends prompts with a JSON schema to Google Gemini and returns structured JSON. If Gemini is unavailable the web app falls back to keyword matching.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1719"/><stop offset="1" stop-color="#090f11"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.1" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#5fe3b5" stop-opacity=".15"/><stop offset="1" stop-color="#5fe3b5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="0.55" r="0.4">
      <stop offset="0" stop-color="#a3b8ff" stop-opacity=".12"/><stop offset="1" stop-color="#a3b8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1d2b2f"/></pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18272b"/><stop offset="1" stop-color="#121d20"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3b8ff"/><stop offset="1" stop-color="#5fe3b5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7d928c"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a3b8ff"/></marker>
    <style>
      .card { fill: url(#card); stroke: #2a3b3f; stroke-width: 1.2; }
      .h { fill: #eef5f2; font-size: 16px; font-weight: 600; }
      .s { fill: #9fb1ab; font-size: 12.5px; }
      .cap { fill: #6f8682; font-size: 11px; font-weight: 700; letter-spacing: .14em; }
      .row { fill: #0f191b; stroke: #243438; }
      .rowt { fill: #dbe6e2; font-size: 13px; }
      .mono { font-family: Consolas, "Cascadia Mono", Menlo, monospace; }
      .ep { fill: #cfe0ff; font-size: 12.5px; }
      .eps { fill: #8fa39d; font-size: 11.5px; }
      .lbl { fill: #8fa39d; font-size: 11px; }
      .flow { stroke: #7d928c; stroke-width: 2; fill: none; }
      .chip { fill: #142024; stroke: #2a3b3f; }
      .chipt { fill: #dbe6e2; font-size: 12.5px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="640" rx="24" fill="url(#bg)"/>
  <rect width="1100" height="640" rx="24" fill="url(#dots)" opacity=".7"/>
  <rect width="1100" height="640" rx="24" fill="url(#glowA)"/>
  <rect width="1100" height="640" rx="24" fill="url(#glowB)"/>
  <rect x=".75" y=".75" width="1098.5" height="638.5" rx="23.5" fill="none" stroke="#223236"/>

  <!-- Header -->
  <g transform="translate(48 40)">
    <rect width="30" height="30" rx="9" fill="#5fe3b5"/>
    <path d="M8 15.5l4.5 4.5L22 10.5" stroke="#04211a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="21" fill="#eef5f2" font-size="22" font-weight="700">ReadyCheck architecture</text>
  </g>
  <text x="48" y="96" fill="#9fb1ab" font-size="14">A React web app on Vercel. AI calls go through one serverless API, so the Gemini key never reaches the browser.</text>

  <!-- Column captions -->
  <text class="cap" x="48" y="140">USERS</text>
  <text class="cap" x="228" y="140">BROWSER</text>
  <text class="cap" x="914" y="140">AI</text>

  <!-- ===== Users ===== -->
  <g filter="url(#shadow)"><rect class="card" x="48" y="168" width="140" height="118" rx="16"/></g>
  <rect x="48" y="168" width="140" height="4" rx="2" fill="#5fe3b5"/>
  <circle cx="118" cy="204" r="18" fill="#5fe3b5" fill-opacity=".14"/>
  <circle cx="118" cy="199" r="5.5" fill="none" stroke="#5fe3b5" stroke-width="2"/>
  <path d="M108.5 213a9.5 8 0 0 1 19 0" fill="none" stroke="#5fe3b5" stroke-width="2" stroke-linecap="round"/>
  <text class="h" x="118" y="248" text-anchor="middle">New hire</text>
  <text class="s" x="118" y="268" text-anchor="middle">Employee view</text>

  <g filter="url(#shadow)"><rect class="card" x="48" y="330" width="140" height="118" rx="16"/></g>
  <rect x="48" y="330" width="140" height="4" rx="2" fill="#ffad5c"/>
  <circle cx="118" cy="366" r="18" fill="#ffad5c" fill-opacity=".14"/>
  <rect x="109" y="357" width="7" height="7" rx="2" fill="none" stroke="#ffad5c" stroke-width="2"/>
  <rect x="120" y="357" width="7" height="7" rx="2" fill="none" stroke="#ffad5c" stroke-width="2"/>
  <rect x="109" y="368" width="7" height="7" rx="2" fill="none" stroke="#ffad5c" stroke-width="2"/>
  <rect x="120" y="368" width="7" height="7" rx="2" fill="none" stroke="#ffad5c" stroke-width="2"/>
  <text class="h" x="118" y="410" text-anchor="middle">Manager / HR</text>
  <text class="s" x="118" y="430" text-anchor="middle">Manager view</text>

  <path class="flow" d="M188 227 H222" marker-end="url(#a)"/>
  <path class="flow" d="M188 389 H222" marker-end="url(#a)"/>

  <!-- ===== Browser: web app ===== -->
  <g filter="url(#shadow)"><rect class="card" x="228" y="150" width="280" height="330" rx="16"/></g>
  <path d="M228 166 a16 16 0 0 1 16 -16 h248 a16 16 0 0 1 16 16 v14 h-280 z" fill="#1c2c30"/>
  <circle cx="246" cy="165" r="4" fill="#ff7b72"/><circle cx="260" cy="165" r="4" fill="#ffad5c"/><circle cx="274" cy="165" r="4" fill="#5fe3b5"/>
  <text x="368" y="169" text-anchor="middle" fill="#8fa39d" font-size="11" class="mono">ready-check-hackathon.vercel.app</text>
  <text class="h" x="246" y="210">ReadyCheck web app</text>
  <text class="s" x="246" y="229">React 18 · TypeScript · Vite</text>

  <rect class="row" x="246" y="246" width="244" height="34" rx="10"/>
  <circle cx="262" cy="263" r="4.5" fill="#5fe3b5"/><text class="rowt" x="276" y="268">Knowledge Canvas (ask, cards)</text>
  <rect class="row" x="246" y="288" width="244" height="34" rx="10"/>
  <circle cx="262" cy="305" r="4.5" fill="#5fe3b5"/><text class="rowt" x="276" y="310">Ticket rooms + My tickets</text>
  <rect class="row" x="246" y="330" width="244" height="34" rx="10"/>
  <circle cx="262" cy="347" r="4.5" fill="#ffad5c"/><text class="rowt" x="276" y="352">Command Center (6 tabs)</text>
  <rect class="row" x="246" y="372" width="244" height="34" rx="10"/>
  <circle cx="262" cy="389" r="4.5" fill="#7d928c"/><text class="rowt" x="276" y="394">Shared app state</text>
  <rect class="row" x="246" y="414" width="244" height="46" rx="10"/>
  <circle cx="262" cy="431" r="4.5" fill="#7d928c"/><text class="rowt" x="276" y="436">Offline fallback</text>
  <text class="eps" x="276" y="452">keyword match if AI is down</text>

  <!-- ===== Vercel ===== -->
  <rect x="568" y="128" width="280" height="370" rx="18" fill="#ffffff" fill-opacity=".015" stroke="#3a4d52" stroke-dasharray="6 6"/>
  <path d="M584 147 l7 -12 l7 12 z" fill="#eef5f2"/>
  <text x="606" y="146" fill="#eef5f2" font-size="12" font-weight="700" letter-spacing=".12em">VERCEL</text>

  <g filter="url(#shadow)"><rect class="card" x="584" y="164" width="248" height="62" rx="14"/></g>
  <text class="h" x="602" y="191" font-size="15">Static site</text>
  <text class="s" x="602" y="211">dist/ · HTML, JS, CSS</text>

  <g filter="url(#shadow)"><rect class="card" x="584" y="244" width="248" height="236" rx="14"/></g>
  <rect x="584" y="244" width="248" height="4" rx="2" fill="#a3b8ff"/>
  <text class="h" x="602" y="274" font-size="15">Serverless API</text>
  <text class="s mono" x="602" y="293" font-size="12">api/[route].ts → server/</text>

  <text class="ep mono" x="602" y="322">POST /api/answer</text>
  <text class="eps" x="602" y="338">pick or write the answer card</text>
  <text class="ep mono" x="602" y="362">POST /api/theme-summary</text>
  <text class="eps" x="602" y="378">why people are stuck on a topic</text>
  <text class="ep mono" x="602" y="402">POST /api/room-reply</text>
  <text class="eps" x="602" y="418">expert reply in the demo chat</text>
  <text class="ep mono" x="602" y="442">POST /api/summarize-room</text>
  <text class="eps" x="602" y="458">solved chat → knowledge card</text>

  <!-- Browser ↔ Vercel -->
  <path class="flow" d="M574 195 H514" stroke-dasharray="5 5" marker-end="url(#a)"/>
  <text class="lbl" x="541" y="186" text-anchor="middle">serves</text>
  <path class="flow" d="M508 335 H578" marker-end="url(#aB)" stroke="#a3b8ff"/>
  <text class="lbl mono" x="538" y="326" text-anchor="middle">POST</text>
  <path class="flow" d="M578 365 H514" marker-end="url(#a)"/>
  <text class="lbl mono" x="538" y="382" text-anchor="middle">JSON</text>

  <!-- ===== Gemini ===== -->
  <g filter="url(#shadow)"><rect class="card" x="914" y="244" width="138" height="186" rx="16"/></g>
  <rect x="914" y="244" width="138" height="4" rx="2" fill="url(#gem)"/>
  <path d="M983 268 C985 282 990 287 1004 289 C990 291 985 296 983 310 C981 296 976 291 962 289 C976 287 981 282 983 268 Z" fill="url(#gem)"/>
  <text class="h" x="983" y="338" text-anchor="middle" font-size="15">Google Gemini</text>
  <text x="983" y="358" text-anchor="middle" fill="#cfe0ff" font-size="13" font-weight="600">3.5 Flash-Lite</text>
  <text class="eps" x="983" y="376" text-anchor="middle">model set in env</text>
  <text class="eps" x="983" y="404" text-anchor="middle">JSON-schema output</text>

  <!-- Vercel ↔ Gemini -->
  <path class="flow" d="M832 335 H908" marker-end="url(#aB)" stroke="#a3b8ff"/>
  <text class="lbl" x="875" y="318" text-anchor="middle">prompt +</text>
  <text class="lbl" x="875" y="330" text-anchor="middle">schema</text>
  <path class="flow" d="M914 365 H838" marker-end="url(#a)"/>
  <text class="lbl" x="875" y="382" text-anchor="middle">structured</text>
  <text class="lbl" x="875" y="394" text-anchor="middle">JSON</text>

  <!-- Key badge -->
  <rect x="584" y="508" width="248" height="34" rx="17" fill="#5fe3b5" fill-opacity=".1" stroke="#5fe3b5" stroke-opacity=".55"/>
  <rect x="600" y="523" width="12" height="10" rx="2" fill="none" stroke="#5fe3b5" stroke-width="1.8"/>
  <path d="M602.5 523v-3a3.5 3.5 0 0 1 7 0v3" fill="none" stroke="#5fe3b5" stroke-width="1.8"/>
  <text x="620" y="530" fill="#5fe3b5" font-size="12.5" font-weight="600">GEMINI_API_KEY lives only here</text>
  <path d="M708 508 V500" stroke="#5fe3b5" stroke-opacity=".55" stroke-width="1.5"/>

  <!-- Tech stack strip -->
  <line x1="48" y1="566" x2="1052" y2="566" stroke="#1f2e32"/>
  <text class="cap" x="48" y="602">TECH STACK</text>
  <g>
    <rect class="chip" x="146" y="584" width="84" height="28" rx="14"/><text class="chipt" x="188" y="603" text-anchor="middle">React 18</text>
    <rect class="chip" x="238" y="584" width="94" height="28" rx="14"/><text class="chipt" x="285" y="603" text-anchor="middle">TypeScript</text>
    <rect class="chip" x="340" y="584" width="58" height="28" rx="14"/><text class="chipt" x="369" y="603" text-anchor="middle">Vite</text>
    <rect class="chip" x="406" y="584" width="134" height="28" rx="14"/><text class="chipt" x="473" y="603" text-anchor="middle">CSS design tokens</text>
    <rect class="chip" x="548" y="584" width="132" height="28" rx="14"/><text class="chipt" x="614" y="603" text-anchor="middle">Vercel Functions</text>
    <rect class="chip" x="688" y="584" width="122" height="28" rx="14"/><text class="chipt" x="749" y="603" text-anchor="middle">Google Gemini</text>
    <rect class="chip" x="818" y="584" width="110" height="28" rx="14"/><text class="chipt mono" x="873" y="603" text-anchor="middle" font-size="12">@google/genai</text>
    <rect class="chip" x="936" y="584" width="116" height="28" rx="14"/><text class="chipt" x="994" y="603" text-anchor="middle">Claude Design</text>
  </g>
</svg>
